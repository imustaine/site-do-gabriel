{% extends "base.html" %}

{% block title %}Criar Conta | Aura Joias & Acessórios{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <h1 class="font-display">Criar Conta</h1>
            <p class="subtitle">Cadastre-se para gerenciar seu acervo exclusivo de joias e acessórios.</p>
        </div>

        <form action="{{ url_for('user.cadastro_usuario') }}" method="post" class="form-card mx-auto">
            <div class="mb-3">
                <label for="name">Nome Completo: *</label>
                <input type="text" id="name" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="mb-3">
                <label for="email">E-mail: *</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="mb-3">
                <label for="telefone">Telefone / WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
            </div>

            <div class="mb-3">
                <label for="senha">Senha de Acesso: *</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
            </div>

            <div class="pt-2">
                <input type="submit" value="Finalizar Cadastro" class="w-100">
            </div>

            <div class="text-center mt-3 pt-2 border-top">
                <small class="text-muted">Já tem uma conta? <a href="{{ url_for('auth.login') }}">Fazer login</a>.</small>
            </div>
        </form>
    </div>
</div>
{% endblock %}
