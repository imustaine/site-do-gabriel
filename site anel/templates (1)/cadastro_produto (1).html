{% extends "base.html" %}

{% block title %}Cadastrar Acessório / Joia | Aura{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
        <div class="mb-4 text-center">
            <h1>Cadastrar Acessório</h1>
            <p class="subtitle">Adicione novas joias, anéis, piercings e peças exclusivas ao catálogo.</p>
        </div>

        <form action="{{ url_for('product.cadastrar_produto') }}" method="post" class="form-card mx-auto">

            <div class="mb-3">
                <label for="nome">Nome da Peça / Acessório: *</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Anel Solitário Rubi Imperial, Piercing Argola Titânio..." required>
            </div>

            <div class="form-grid-2">
                <div class="mb-3">
                    <label for="categoria">Categoria: *</label>
                    <select id="categoria" name="categoria" class="form-select" required>
                        <option value="" disabled selected>Selecione a categoria</option>
                        {% for cat in categorias %}
                            <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="material">Material / Acabamento: <span class="form-label-hint">(ex: Prata, Ouro, Titânio)</span></label>
                    <input type="text" list="lista-materiais" id="material" name="material" placeholder="Selecione ou digite...">
                    <datalist id="lista-materiais">
                        {% for mat in materiais %}
                            <option value="{{ mat }}">
                        {% endfor %}
                    </datalist>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="mb-3">
                    <label for="tamanho">Tamanho / Medida: <span class="form-label-hint">(aro, calibre, etc.)</span></label>
                    <input type="text" id="tamanho" name="tamanho" placeholder="Ex: Aro 16, 8mm / 1.2mm, 45cm...">
                </div>

                <div class="mb-3">
                    <label for="quantidade">Quantidade em Estoque: *</label>
                    <input type="number" id="quantidade" name="quantidade" min="0" placeholder="0" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="preco">Preço de Venda (R$): *</label>
                <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="0,00" required>
            </div>

            <div class="mb-3">
                <label for="descricao">Descrição e Detalhes da Peça: <span class="form-label-hint">(pedrarias, cravação, cuidados)</span></label>
                <textarea id="descricao" name="descricao" rows="3" placeholder="Descreva os detalhes da joia, tipo de pedra, fecho, acabamento polido..."></textarea>
            </div>

            <div class="d-flex align-items-center justify-content-between pt-2">
                <input type="submit" value="Salvar no Catálogo">
                <a href="{{ url_for('product.listar_produtos') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
