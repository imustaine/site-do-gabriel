{% extends "base.html" %}

{% block title %}Editar Perfil | Aura Joias & Acessórios{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <h1 class="font-display">Editar Dados</h1>
            <p class="subtitle">Atualize suas informações de cadastro.</p>
        </div>

        <form action="" method="post" class="form-card mx-auto">
            <div class="mb-3">
                <label for="name">Nome Completo: *</label>
                <input type="text" id="name" name="nome" value="{{ usuario.nome }}" required>
            </div>

            <div class="mb-3">
                <label for="email">E-mail: *</label>
                <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
            </div>

            <div class="mb-3">
                <label for="telefone">Telefone / WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" value="{{ usuario.telefone or '' }}">
            </div>

            <div class="d-flex align-items-center justify-content-between pt-2">
                <input type="submit" value="Salvar Alterações">
                <a href="{{ url_for('user.meus_dados') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
