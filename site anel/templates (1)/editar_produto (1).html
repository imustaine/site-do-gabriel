{% extends "base.html" %}

{% block title %}Editar {{ produto.nome }} | Aura{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
        <div class="mb-4 text-center">
            <h1>Editar Acessório</h1>
            <p class="subtitle">Atualize os detalhes, materiais e estoque da peça.</p>
        </div>

        <form action="{{ url_for('product.editar_produto', produto_id=produto.id) }}" method="post" class="form-card mx-auto">

            <div class="mb-3">
                <label for="nome">Nome da Peça / Acessório: *</label>
                <input type="text" id="nome" name="nome" value="{{ produto.nome }}" required>
            </div>

            <div class="form-grid-2">
                <div class="mb-3">
                    <label for="categoria">Categoria: *</label>
                    <select id="categoria" name="categoria" class="form-select" required>
                        {% for cat in categorias %}
                            <option value="{{ cat }}" {% if produto.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="material">Material / Acabamento:</label>
                    <input type="text" list="lista-materiais" id="material" name="material" value="{{ produto.material or '' }}" placeholder="Ex: Prata 925, Ouro 18k...">
                    <datalist id="lista-materiais">
                        {% for mat in materiais %}
                            <option value="{{ mat }}">
                        {% endfor %}
                    </datalist>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="mb-3">
                    <label for="tamanho">Tamanho / Medida:</label>
                    <input type="text" id="tamanho" name="tamanho" value="{{ produto.tamanho or '' }}" placeholder="Ex: Aro 18, 8mm x 1.2mm...">
                </div>

                <div class="mb-3">
                    <label for="quantidade">Quantidade em Estoque: *</label>
                    <input type="number" id="quantidade" name="quantidade" min="0" value="{{ produto.quantidade }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="preco">Preço de Venda (R$): *</label>
                <input type="number" id="preco" name="preco" step="0.01" min="0" value="{{ produto.preco }}" required>
            </div>

            <div class="mb-3">
                <label for="descricao">Descrição e Detalhes da Peça:</label>
                <textarea id="descricao" name="descricao" rows="3">{{ produto.descricao or '' }}</textarea>
            </div>

            <div class="d-flex align-items-center justify-content-between pt-2">
                <input type="submit" value="Salvar Alterações">
                <a href="{{ url_for('product.listar_produtos') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
