{% extends "base.html" %}

{% block title %}Entrar | Aura Joias & Acessórios{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <h1 class="font-display">Bem-vindo(a)</h1>
            <p class="subtitle">Acesse seu painel para gerenciar suas joias e acessórios.</p>
        </div>

        <form action="{{ url_for('auth.submit_login') }}" method="post" class="form-card mx-auto">
            <div class="mb-3">
                <label for="login">E-mail de Acesso:</label>
                <input type="text" id="login" name="login" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="mb-3">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha..." required>
            </div>

            <div class="pt-2">
                <input type="submit" value="Entrar no Sistema" class="w-100">
            </div>

            <div class="text-center mt-3 pt-2 border-top">
                <small class="text-muted">Ainda não possui uma conta? <a href="{{ url_for('user.cadastro_usuario') }}">Cadastre-se aqui</a>.</small>
            </div>
        </form>
    </div>
</div>
{% endblock %}
